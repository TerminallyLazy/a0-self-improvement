name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AGENT_ZERO_COMMIT: b22a144bf59f15b1516084c9e7b88133ba92c8a9

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Sync standalone test dependencies
        run: uv sync --frozen --extra test --python "${{ matrix.python-version }}"

      - name: Collect tests
        run: uv run --frozen --extra test python -m pytest --collect-only -q

      - name: Run tests
        run: uv run --frozen --extra test python -m pytest

      - name: Compile plugin Python
        run: >-
          uv run --frozen --extra test python -m compileall -q
          __init__.py hooks.py worker.py api extensions helpers scripts

      - name: Verify manifest contract
        run: uv run --frozen --extra test python -m pytest -q tests/test_manifest_contract.py

      - name: Scan standalone source for secrets
        run: uv run --frozen --extra test python scripts/scan_source_secrets.py

      - name: Check out pinned Agent Zero contract
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/agent0ai/agent-zero.git "$RUNNER_TEMP/agent-zero-contract"
          git -C "$RUNNER_TEMP/agent-zero-contract" checkout --detach "$AGENT_ZERO_COMMIT"

      - name: Verify pinned Agent Zero contract without imports
        run: >-
          uv run --frozen --extra test python scripts/check_agent_zero_contract.py
          --agent-zero-root "$RUNNER_TEMP/agent-zero-contract"
          --expected-commit "$AGENT_ZERO_COMMIT"
